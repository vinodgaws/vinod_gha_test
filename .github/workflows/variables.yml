name: variables examples
on:
    push:
        branches: ["*"]
env: 
    NAME: Vinod
jobs: 
    myfirstjob:
        runs-on: ubuntu-26.04
        env:
            GREETING: Hello
        steps:
            - name: print my name
              env:
                  course: GHA
              run: echo "$GREETING, Am $NAME and  Am learning $course.. am working on ${{ vars.PROJECT_NAME}}"
            - name: print repo name vairable
              run: echo "My github repo name is ${{ github.repository }}"
            - name: print triggered by name variables
              run: echo "my workflow triggered name is ${{ github.actor }}"
            