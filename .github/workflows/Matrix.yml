name: Node Js Matrix Setup

on:
  push:
    branches: ["*"]

jobs:
    node-setup:
        runs-on: ubuntu-24.04
        strategy:
            matrix:
                node: [22, 24, 26]
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                node-version: ${{ matrix.node }}
            - run: npm install
            - run: node index.js
            - run: node -v