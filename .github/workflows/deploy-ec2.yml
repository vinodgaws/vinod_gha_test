name: deploy to ec2
on:
    workflow_dispatch:
    push:
        branches:
            - main
jobs:
    deploy:
        runs-on: ubuntu-26.04
        steps:
            - name: checkout code
              uses: actions/checkout@v7

            - name: step ssh key in runner
              run: |
                echo "${{ secrets.EC2_SSH_KEY}}" > linuxser-kp.pem
                chmod 400 linuxser-kp.pem
            
            - name: copy file to ec2 using scp
              run: |
               sudo scp -o StrictHostKeyChecking=no -i linuxser-kp.pem -r *.html ${{ secrets.AWS_EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/html/